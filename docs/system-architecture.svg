<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">PG Manager System Architecture</title>
<desc id="desc">Architecture showing browser React client, Nginx HTTPS reverse proxy, Node and Express API, PostgreSQL, and deployment options.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111b31"/></linearGradient>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5aa9ff"/></marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71e3aa"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffbf69"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#f3f6ff}
    .muted{fill:#aab6d3}.tag{font-size:15px;font-weight:750;letter-spacing:1.8px}
    .heading{font-size:34px;font-weight:750}.subheading{font-size:19px}
    .boxTitle{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}
    .flowLabel{font-size:14px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="1050" rx="28" fill="url(#bg)"/>
<text x="64" y="55" class="tag" fill="#49d8cf" style="fill:#49d8cf">PG MANAGER / SYSTEM DESIGN</text>
<text x="64" y="103" class="heading">System Architecture</text>
<text x="66" y="137" class="subheading muted">React + Vite • Express API • PostgreSQL • role-based access</text>
<line x1="64" y1="165" x2="1536" y2="165" stroke="#263554" stroke-width="2"/>

<!-- Client -->
<rect x="65" y="215" width="330" height="190" rx="20" fill="#131c33" stroke="#5aa9ff" stroke-width="2.5"/>
<text x="91" y="245" class="tag" style="fill:#5aa9ff">CLIENT LAYER</text>
<text x="230" y="292" text-anchor="middle" class="boxTitle">Owner / Admin</text>
<text x="230" y="323" text-anchor="middle" class="boxTitle">Tenant</text>
<line x1="95" y1="341" x2="365" y2="341" stroke="#314461"/>
<text x="230" y="368" text-anchor="middle" class="body muted">Browser • responsive UI</text>
<text x="230" y="391" text-anchor="middle" class="body muted">React 18 + Vite</text>

<!-- Edge -->
<rect x="485" y="215" width="320" height="190" rx="20" fill="#131c33" stroke="#a78bfa" stroke-width="2.5"/>
<text x="511" y="245" class="tag" style="fill:#a78bfa">EDGE / REVERSE PROXY</text>
<text x="645" y="298" text-anchor="middle" class="boxTitle">Nginx + HTTPS</text>
<line x1="515" y1="322" x2="775" y2="322" stroke="#314461"/>
<text x="645" y="352" text-anchor="middle" class="body muted">AWS EC2 deployment</text>
<text x="645" y="378" text-anchor="middle" class="body muted">TLS termination / forwarding</text>

<!-- App -->
<rect x="895" y="195" width="640" height="255" rx="20" fill="#182541" stroke="#49d8cf" stroke-width="2.5"/>
<text x="923" y="225" class="tag" style="fill:#49d8cf">APPLICATION LAYER</text>
<text x="1215" y="264" text-anchor="middle" class="boxTitle">Node.js + Express • Port 5000</text>
<line x1="925" y1="285" x2="1505" y2="285" stroke="#324769" stroke-width="2"/>
<rect x="925" y="307" width="178" height="105" rx="12" fill="#101a30" stroke="#3e5c83"/>
<text x="1014" y="337" text-anchor="middle" class="body" font-weight="700">Auth + Session</text>
<text x="1014" y="365" text-anchor="middle" class="small muted">JWT cookie</text>
<text x="1014" y="386" text-anchor="middle" class="small muted">CSRF + RBAC</text>
<rect x="1121" y="307" width="178" height="105" rx="12" fill="#101a30" stroke="#3e5c83"/>
<text x="1210" y="337" text-anchor="middle" class="body" font-weight="700">Core APIs</text>
<text x="1210" y="365" text-anchor="middle" class="small muted">Rooms • Tenants</text>
<text x="1210" y="386" text-anchor="middle" class="small muted">Dashboard</text>
<rect x="1317" y="307" width="188" height="105" rx="12" fill="#101a30" stroke="#3e5c83"/>
<text x="1411" y="337" text-anchor="middle" class="body" font-weight="700">Operations</text>
<text x="1411" y="365" text-anchor="middle" class="small muted">Payments • Complaints</text>
<text x="1411" y="386" text-anchor="middle" class="small muted">Notices • Expenses • Audit</text>

<!-- Client to proxy and proxy to app arrows -->
<line x1="395" y1="309" x2="478" y2="309" stroke="#5aa9ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
<text x="435" y="288" text-anchor="middle" class="flowLabel" style="fill:#5aa9ff">HTTPS</text>
<line x1="805" y1="309" x2="888" y2="309" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowPurple)"/>
<text x="847" y="288" text-anchor="middle" class="flowLabel" style="fill:#a78bfa">proxy</text>

<!-- Database -->
<rect x="895" y="555" width="640" height="220" rx="20" fill="#131c33" stroke="#71e3aa" stroke-width="2.5"/>
<text x="923" y="585" class="tag" style="fill:#71e3aa">DATA LAYER</text>
<text x="1215" y="628" text-anchor="middle" class="boxTitle">PostgreSQL</text>
<text x="1215" y="660" text-anchor="middle" class="body muted">Users • rooms • rent payments / proofs</text>
<text x="1215" y="686" text-anchor="middle" class="body muted">Complaints • notices • expenses • audit log</text>
<rect x="950" y="710" width="530" height="38" rx="9" fill="#102719" stroke="#356e55"/>
<text x="1215" y="734" text-anchor="middle" class="small" style="fill:#71e3aa">pg driver • parameterized SQL • schema migrations</text>
<line x1="1215" y1="450" x2="1215" y2="547" stroke="#71e3aa" stroke-width="3" marker-end="url(#arrowGreen)"/>
<text x="1232" y="493" class="flowLabel" style="fill:#71e3aa">SQL queries</text>
<text x="1232" y="514" class="small muted">parameterized</text>

<!-- Development/demo path -->
<rect x="65" y="500" width="700" height="275" rx="20" fill="#131c33" stroke="#ffbf69" stroke-width="2"/>
<text x="92" y="532" class="tag" style="fill:#ffbf69">DEVELOPMENT &amp; DEMO</text>
<rect x="95" y="557" width="270" height="132" rx="14" fill="#201d29" stroke="#8d714b"/>
<text x="230" y="589" text-anchor="middle" class="boxTitle">Vite dev server</text>
<text x="230" y="619" text-anchor="middle" class="body muted">Frontend on :5173</text>
<text x="230" y="647" text-anchor="middle" class="small muted">/api proxy → :5000</text>
<text x="230" y="671" text-anchor="middle" class="small muted">same-origin cookies</text>
<rect x="395" y="557" width="340" height="132" rx="14" fill="#201d29" stroke="#8d714b"/>
<text x="565" y="589" text-anchor="middle" class="boxTitle">Demo / test database</text>
<text x="565" y="620" text-anchor="middle" class="body muted">pg-mem emulator</text>
<text x="565" y="647" text-anchor="middle" class="small muted">In-memory • ephemeral data</text>
<text x="400" y="730" class="small" style="fill:#ffbf69">Alternate local workflow; production uses PostgreSQL.</text>
<path d="M230 405 V470 H430 V490" fill="none" stroke="#ffbf69" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowOrange)"/>

<!-- Deploy -->
<rect x="65" y="825" width="1470" height="133" rx="18" fill="#10182b" stroke="#33466e" stroke-width="2"/>
<text x="95" y="858" class="tag" style="fill:#5aa9ff">DEPLOYMENT OPTIONS</text>
<text x="95" y="896" class="boxTitle">AWS</text>
<text x="185" y="896" class="body muted">EC2 + Nginx + PM2 → private RDS PostgreSQL</text>
<line x1="790" y1="875" x2="790" y2="931" stroke="#33466e" stroke-width="2"/>
<text x="830" y="896" class="boxTitle">Docker Compose</text>
<text x="830" y="925" class="body muted">Application container + PostgreSQL 16</text>
<text x="65" y="997" class="small muted">Security across the API: httpOnly SameSite cookie • JWT (8 h) • role checks • CSRF header • rate limits • Helmet / CSP</text>
<text x="65" y="1023" class="small muted">Architecture based on repository source, Dockerfile, Compose configuration and deployment guide.</text>
</svg>