# /etc/nginx/sites-available/pgmanager      (replace YOUR_DOMAIN)
# Node serves both the API and the React app, so Nginx only has to forward everything.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# `certbot --nginx` adds the HTTPS (443) block and the http -> https redirect.
